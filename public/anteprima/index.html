      <p>Sono Nicola. Fotografo con base a Verona. Realizzo reportage, editoriali e campagne, in studio o outdoor. Still‑life e video.</p>
      <p>Con le mie immagini voglio raccontare una storia. Grazie a essa cerco sempre di alzare l'asticella, come un atleta.</p>
      <p>Amo il movimento, l’adrenalina, la tranquillità e il silenzio che anticipano la performance, il sogno del record personale, la forza, la mentalità e la grinta necessarie per raggiungere il proprio obiettivo.</p>
